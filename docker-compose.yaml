version: "3"

services:

  database:
    image: postgres:15
    container_name: database
    hostname: database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: files
    restart: always

  file_manager:
    build:
      context: .
      dockerfile: k8s/file_manager/Dockerfile
      args:
        BASE_DIR: ""
    container_name: file_manager
    hostname: file_manager
    ports:
      - "8000:8000"
    environment:
      DEBUG: True
      DJANGO_SECRET_KEY: dummy
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: files
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
    restart: always
